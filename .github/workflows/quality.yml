# 自动化质量门禁：Pester + CHANGELOG + 目录命名 + Tools 与 Docs/工具说明 文档对齐
name: Quality

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-changelog:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Pester
        run: |
          Install-Module Pester -Force -Scope CurrentUser -MinimumVersion 5.0
          Import-Module ./RecipeManager.psd1 -Force
          Invoke-Pester ./Tests/RecipeManager.Tests.ps1 -CI

      - name: Changelog gate
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
        run: ./Tools/Test-ChangelogGate.ps1

      - name: Directory naming gate (Docs)
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
        run: ./Tools/Test-DirectoryNamingGate.ps1 -RootRelativePath Docs

      - name: Tools script documentation gate
        run: ./Tools/Test-ToolsDocsGate.ps1
